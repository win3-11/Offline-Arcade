<style>
/* =========================================================
   Offline Arcade — стили
   Своя мини-система вместо Tailwind: нужен полный офлайн.
   ========================================================= */

/* ---------- Токены тем ---------- */
:root {
  --radius: 14px;
  --gap: 14px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

[data-theme="dark"] {
  --bg: #0b0f19;
  --bg-soft: #121826;
  --card: #161d2e;
  --card-2: #1d2639;
  --text: #e7ecf5;
  --muted: #8d99b3;
  --border: #263149;
  --accent: #6c8cff;
  --accent-2: #37d39b;
  --danger: #ff5c72;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
}

[data-theme="light"] {
  --bg: #f4f6fb;
  --bg-soft: #ffffff;
  --card: #ffffff;
  --card-2: #eef1f8;
  --text: #131826;
  --muted: #64708a;
  --border: #dde3ef;
  --accent: #3d5afe;
  --accent-2: #10a37f;
  --danger: #e0264a;
  --shadow: 0 8px 24px rgba(20, 30, 60, .10);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
}

body { overscroll-behavior: none; }

/* ---------- Каркас приложения ---------- */
.app {
  max-width: 960px;
  margin: 0 auto;
  padding: 16px 16px 40px;
  padding-bottom: calc(40px + env(safe-area-inset-bottom));
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: .2px;
}

.brand .logo {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  color: #fff;
}

.brand small {
  display: block;
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
}

.spacer { flex: 1; }

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  transition: .15s;
}
.icon-btn:hover { background: var(--card-2); }
.icon-btn:active { transform: scale(.94); }

/* ---------- Главный экран ---------- */
.hero {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 26px;
  margin-bottom: 22px;
  box-shadow: var(--shadow);
}
.hero h1 { margin: 0 0 6px; font-size: clamp(24px, 5vw, 34px); }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; }

.badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.badge {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--card-2);
  border: 1px solid var(--border);
  color: var(--muted);
}

.grid-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: var(--gap);
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--shadow);
  transition: transform .15s, border-color .15s;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent); }

.card .thumb {
  height: 92px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 30px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -1px;
}
.card h3 { margin: 0; font-size: 18px; }
.card p { margin: 0; color: var(--muted); font-size: 13px; min-height: 32px; }

.card .meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: var(--muted);
}
.card .meta b { color: var(--text); }

/* ---------- Кнопки ---------- */
.btn {
  border: 1px solid var(--border);
  background: var(--card-2);
  color: var(--text);
  border-radius: 12px;
  padding: 11px 16px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: .15s;
}
.btn:hover { background: var(--border); }
.btn:active { transform: scale(.97); }
.btn.primary {
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  border-color: transparent;
  color: #fff;
}
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }

/* ---------- Экран игры ---------- */
.game-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.game-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }

.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 14px;
  min-width: 92px;
}
.stat span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.stat b { font-size: 19px; font-variant-numeric: tabular-nums; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.seg { display: flex; background: var(--card-2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.seg button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 9px 14px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

.board-wrap { display: grid; place-items: center; }

/* ---------- 2048 ---------- */
.g2048 {
  width: min(92vw, 400px);
  aspect-ratio: 1;
  display: grid;
  /* grid без явных колонок схлопывается в одну колонку — колонки задаём явно */
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 10px;
  padding: 10px;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 18px;
  touch-action: none;
}
.g2048 .cell {
  border-radius: 12px;
  background: var(--card);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: clamp(20px, 6vw, 34px);
  color: var(--muted);
  transition: .12s;
}
.g2048 .cell.filled { animation: pop .14s ease-out; }
.g2048 .cell[data-v="2"]    { background: #2b3550; color: #d7e0f5; }
.g2048 .cell[data-v="4"]    { background: #34406a; color: #e7ecf5; }
.g2048 .cell[data-v="8"]    { background: #3f5bd9; color: #fff; }
.g2048 .cell[data-v="16"]   { background: #4f6cf0; color: #fff; }
.g2048 .cell[data-v="32"]   { background: #2f8f6d; color: #fff; }
.g2048 .cell[data-v="64"]   { background: #37b57f; color: #fff; }
.g2048 .cell[data-v="128"]  { background: #e2b93b; color: #222; font-size: clamp(18px,5vw,30px); }
.g2048 .cell[data-v="256"]  { background: #eaa92c; color: #222; font-size: clamp(18px,5vw,30px); }
.g2048 .cell[data-v="512"]  { background: #ef8f22; color: #222; font-size: clamp(18px,5vw,30px); }
.g2048 .cell[data-v="1024"] { background: #ef6f1f; color: #fff; font-size: clamp(15px,4.2vw,24px); }
.g2048 .cell[data-v="2048"] { background: var(--accent-2); color: #06231a; font-size: clamp(15px,4.2vw,24px); }
.g2048 .cell.won { box-shadow: inset 0 0 0 3px #fff6; }

@keyframes pop { from { transform: scale(.82); } to { transform: scale(1); } }

/* ---------- Змейка ---------- */
.snake-wrap { display: grid; place-items: center; gap: 14px; }
.snake-grid {
  width: min(92vw, 420px);
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(20, 1fr);
  grid-template-rows: repeat(20, 1fr);
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 6px;
  gap: 2px;
  touch-action: none;
}
.snake-cell { border-radius: 4px; background: transparent; }
.snake-cell.head { background: var(--accent-2); border-radius: 6px; }
.snake-cell.body { background: var(--accent); opacity: .75; }
.snake-cell.food { background: var(--danger); border-radius: 50%; transform: scale(.6); }

.dpad { display: none; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 6px; }
.dpad button { font-size: 18px; }
.dpad .u { grid-area: 1/2 } .dpad .l { grid-area: 2/1 }
.dpad .r { grid-area: 2/3 } .dpad .dn { grid-area: 3/2 }

/* ---------- Сапер ---------- */
.mine-wrap { display: grid; place-items: center; gap: 14px; }
.mine-grid {
  display: grid;
  gap: 2px;
  background: var(--border);
  border: 4px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
.mc {
  width: clamp(24px, 7.4vw, 36px);
  height: clamp(24px, 7.4vw, 36px);
  border: 0;
  padding: 0;
  font: inherit;
  font-weight: 700;
  font-size: clamp(12px, 3.4vw, 16px);
  background: var(--card-2);
  color: var(--text);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.mc:hover { background: var(--border); }
.mc.open { background: var(--bg-soft); cursor: default; }
.mc.mine { background: var(--danger); }
.mc.flag { background: var(--card); }
.mc.n1 { color: #4d8bff } .mc.n2 { color: #37b57f } .mc.n3 { color: #ef6f1f }
.mc.n4 { color: #8b5cf6 } .mc.n5 { color: #e0264a } .mc.n6 { color: #17a2b8 }
.mc.n7 { color: #e2e8f0 } .mc.n8 { color: #94a3b8 }

/* ---------- Тетрис ---------- */
.tet-wrap { display: grid; place-items: center; gap: 14px; }
.tet-cols { display: flex; align-items: flex-start; gap: 14px; }
.tet-side { display: flex; flex-direction: column; gap: 10px; }
.tet-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 12px;
  min-width: 84px;
}
.tet-box span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; }
.tet-box b { font-size: 20px; font-variant-numeric: tabular-nums; }
.tet-canvas {
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  touch-action: none;
}

/* ---------- Оверлей результата ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 8, 15, .72);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 50;
}
.overlay[hidden] { display: none; }
.dialog {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 26px;
  text-align: center;
  max-width: 380px;
  width: 100%;
  box-shadow: var(--shadow);
}
.dialog h2 { margin: 0 0 6px; }
.dialog p { margin: 0 0 18px; color: var(--muted); }
.dialog .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ---------- Подвал / мобильные кнопки ---------- */
.foot { margin-top: 28px; text-align: center; color: var(--muted); font-size: 12px; }

@media (max-width: 640px) {
  .dpad { display: grid; }
  .tet-cols { flex-direction: column; align-items: center; }
  .tet-side { flex-direction: row; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* Собрано build.mjs. Никаких внешних запросов — открывается двойным кликом. */
(function () {
/* js/utils.js */
const m_js_utils = (function () {
/**
 * Мелкие утилиты: DOM-хелперы, свайпы, короткий звук на WebAudio.
 */

/** Создание элемента: el('div', {class:'x', onclick:fn}, child, 'text') */
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    // Строка с разметкой станет ТЕКСТОМ, а не элементом — предупреждаем.
    // Для SVG используй iconEl() из icons.js.
    if (typeof c === 'string' && c.trimStart().startsWith('<')) {
      console.warn('el(): строка с разметкой вставлена как текст. Используй { html } или iconEl().');
    }
    node.append(c?.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}
const $ = (sel, root = document) => root.querySelector(sel);

/**
 * Вешает распознавание свайпов на элемент.
 * @param {HTMLElement} node
 * @param {(dx:number, dy:number)=>boolean} onSwipe — вернуть true, если жест обработан
 * @param {number} threshold — минимальная длина жеста, px
 */
function onSwipe(node, onSwipe, threshold = 28) {
  let sx = 0, sy = 0, tracking = false;

  node.addEventListener('pointerdown', (e) => {
    // Правый клик мышью — это не начало свайпа
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    sx = e.clientX; sy = e.clientY; tracking = true;
  });

  node.addEventListener('pointermove', (e) => {
    if (!tracking) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.hypot(dx, dy) < threshold) return;
    tracking = false;
    onSwipe(dx, dy);
    sx = e.clientX; sy = e.clientY;
  });

  const stop = () => { tracking = false; };
  node.addEventListener('pointerup', stop);
  node.addEventListener('pointercancel', stop);
}

/**
 * Короткий «бип» на WebAudio — без внешних файлов, работает офлайн.
 * Ничего не делает, если звук выключен или AudioContext заблокирован.
 */
function beep(freq = 440, ms = 70, type = 'square', gain = 0.04) {
  let enabled = false;
  try { enabled = JSON.parse(localStorage.getItem('offline-arcade:settings') || '{}').sound; } catch { /* ignore */ }
  if (!enabled) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = (beep.ctx ||= new AC());
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const vol = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    vol.gain.value = gain;
    osc.connect(vol).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + ms / 1000);
  } catch {
    /* ignore */
  }
}

/** Клавиатура: вызов onKey по key, без срабатывания в полях ввода. */
function onKey(handler) {
  const fn = (e) => {
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    handler(e);
  };
  window.addEventListener('keydown', fn);
  return () => window.removeEventListener('keydown', fn);
}

  return { el, $, onSwipe, beep, onKey };
})();

/* js/icons.js */
const m_js_icons = (function () {
 /**
  * Иконки в стиле Lucide (MIT), встроенные инлайн-SVG:
  * без внешних зависимостей, работают офлайн.
  *
  * Использование:
  *   icon('grid')   → строка разметки, только для свойства { html: ... }
  *   iconEl('grid') → готовый SVG-узел, для дочерних элементов el(...)
  */
const PATHS = {
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  arrowLeft: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>',
  play: '<path d="m5 3 14 9-14 9V3Z"/>',
  rotate: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  home: '<path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/>',
  trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.7V17a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2.3"/><path d="M6 4h12v5a6 6 0 0 1-12 0Z"/>',
  wifiOff: '<path d="m2 2 20 20"/><path d="M8.5 8.5A10 10 0 0 1 21 9"/><path d="M5 12.5A10 10 0 0 1 10 10"/><path d="M2 8.8A15 15 0 0 1 6.7 6"/><path d="M12 20h.01"/>',
  download: '<path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/>',
};

/**
 * Иконка как готовый SVG-узел — для передачи в el(...) как дочерний элемент.
 * Строковый вариант icon() годится только для свойства `html`.
 * @param {keyof typeof PATHS} name
 */
function iconEl(name, size = 20) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  svg.innerHTML = PATHS[name] || '';
  return svg;
}

/** @param {keyof typeof PATHS} name */
function icon(name, size = 20) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
    stroke-linejoin="round" aria-hidden="true">${PATHS[name] || ''}</svg>`;
}

  return { iconEl, icon };
})();

/* js/storage.js */
const m_js_storage = (function () {
/**
 * Слой хранения: рекорды, настройки и состояние игр.
 * Всё в localStorage — работает офлайн и синхронно.
 */

const NS = 'offline-arcade:';
const K = {
  scores: NS + 'scores',        // { gameId: { best, bestAt } }
  settings: NS + 'settings',    // { theme, sound }
  states: NS + 'states',        // { gameId: сериализованное состояние }
};

function read(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function write(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {
    /* приватный режим / переполнение — просто игнорируем */
  }
}

/* ---------- Рекорды ---------- */
const scores = {
  all() {
    return read(K.scores, {});
  },
  best(gameId) {
    return this.all()[gameId]?.best ?? 0;
  },
  /** Сохраняет и возвращает true, если побит прежний рекорд. */
  submit(gameId, value) {
    if (typeof value !== 'number' || !Number.isFinite(value) || value <= 0) return false;
    const data = this.all();
    const prev = data[gameId]?.best ?? 0;
    if (value <= prev) return false;
    data[gameId] = { best: value, bestAt: Date.now() };
    write(K.scores, data);
    return true;
  },
  reset(gameId) {
    const data = this.all();
    delete data[gameId];
    write(K.scores, data);
  },
};

/* ---------- Настройки ---------- */
const DEFAULT_SETTINGS = { theme: 'dark', sound: false };
const settings = {
  get() {
    return { ...DEFAULT_SETTINGS, ...read(K.settings, {}) };
  },
  set(patch) {
    const next = { ...this.get(), ...patch };
    write(K.settings, next);
    return next;
  },
};

/* ---------- Состояние игр (автосохранение) ---------- */
const saveState = {
  load(gameId) {
    return read(K.states, {})[gameId] ?? null;
  },
  save(gameId, state) {
    const all = read(K.states, {});
    all[gameId] = state;
    write(K.states, state ? all : { ...all, [gameId]: null });
  },
  clear(gameId) {
    const all = read(K.states, {});
    delete all[gameId];
    write(K.states, all);
  },
};

  return { scores, settings, saveState };
})();

/* js/nav.js */
const m_js_nav = (function () {
const el = m_js_utils.el;
const icon = m_js_icons.icon;

/**
 * Роутинг без циклических импортов.
 *
 * Раньше app.js импортировал игры, а игры импортировали navigate из app.js.
 * Теперь навигация живёт здесь: и бандлеру, и браузеру всё равно, откуда игра
 * получит переход на главный экран — главное, что цикла импортов нет.
 */



const routes = new Map();   // path -> { title, load?, render? }
let host = null;            // контейнер, куда рисуем экраны
let onLeave = null;         // dispose активной игры
let token = 0;              // защита от гонки при быстрых переходах

/** Текущий маршрут из адресной строки: '#/g2048' → 'g2048'. */
const getRoute = () => (location.hash.replace(/^#\/?/, '') || 'home');
function register(path, route) {
  routes.set(path, route);
}
function mount(node) {
  host = node;
  window.addEventListener('hashchange', render);
  render();
}

/** Переход на экран: меняем hash и рисуем сразу, не дожидаясь события. */
function navigate(path) {
  if (location.hash === '#/' + path) return render();
  location.hash = '#/' + path;
  return render();
}

async function render() {
  const mine = ++token;
  if (onLeave) { onLeave(); onLeave = null; }

  const path = getRoute();
  const route = routes.get(path) || routes.get('home');
  if (!host || !route) return;

  // На file:// меняем hash через location.replace — иначе Chromium показывает
  // предупреждение «Небезопасная перезагрузка сайта».
  if (location.protocol === 'file:') {
    const target = '#/' + path;
    if (location.hash !== target) {
      try { history.replaceState(null, '', target); }
      catch { /* некоторые браузеры на file:// это блокируют — тогда просто меняем */ }
    }
  }

  const view = el('div', { class: 'view' });
  const shell = () => el('div', { class: 'app' }, topbar(route.title), view);

  // Сразу рисуем каркас — экран не остаётся пустым, пока грузится модуль игры
  host.replaceChildren(shell());

  if (!route.load) {
    view.append(route.render());
  } else {
    view.append(el('div', { class: 'foot', text: 'Загрузка…' }));
    try {
      const mod = await route.load();
      if (mine !== token) return;            // пока грузили, ушли на другой экран
      view.replaceChildren();
      const res = route.render(mod);
      // Игра возвращает { node, dispose } — dispose вызовется при уходе
      if (res && typeof res === 'object' && res.node) {
        onLeave = res.dispose || null;
        view.append(res.node);
      } else {
        view.append(res);
      }
    } catch (err) {
      if (mine !== token) return;
      console.error('Не удалось открыть игру', path, err);
      view.replaceChildren(el('p', { class: 'foot', text: 'Не удалось открыть игру «' + route.title + '»: ' + err.message }));
    }
  }

  if (mine !== token) return;
  host.replaceChildren(shell());
  window.scrollTo(0, 0);
}

/**
 * Шапка приложения. Кнопки темы и звука вставляет app.js через
 * слоты .theme-slot / .sound-slot — у него есть доступ к настройкам.
 */
function topbar(title) {
  return el('div', { class: 'topbar' },
    el('button', {
      class: 'icon-btn', title: 'На главную', 'aria-label': 'На главную',
      html: icon('home'), onclick: () => navigate('home'),
    }),
    el('div', { class: 'brand' },
      el('div', { class: 'logo', html: icon('grid', 22) }),
      el('div', {}, title, el('small', { text: 'работает без интернета' })),
    ),
    el('div', { class: 'spacer' }),
    el('div', { class: 'sound-slot' }),
    el('div', { class: 'theme-slot' }),
  );
}

  return { getRoute, register, mount, navigate };
})();

/* js/games/game2048.js */
const m_js_games_game2048 = (function () {
const el = m_js_utils.el;
const onSwipe = m_js_utils.onSwipe;
const onKey = m_js_utils.onKey;
const beep = m_js_utils.beep;
const iconEl = m_js_icons.iconEl;
const scores = m_js_storage.scores;
const saveState = m_js_storage.saveState;
const navigate = m_js_nav.navigate;

/**
 * 2048 — классика на сетке 4x4.
 * Управление: стрелки / WASD / свайпы. Автосохранение в localStorage.
 */





const SIZE = 4;
const GOAL = 2048;
const ID = 'g2048';

/** @type {number[][]} матрица: 0 — пусто */
let board = [];
let score = 0;
let best = 0;
let over = false;
let won = false;
let keepPlaying = false;

/* ---------- Логика ---------- */

function emptyBoard() {
  return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
}

/** Добавляет плитку 2 (90%) или 4 (10%) в случайную пустую клетку. */
function addTile() {
  const free = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (!board[r][c]) free.push([r, c]);
  if (!free.length) return false;
  const [r, c] = free[Math.floor(Math.random() * free.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
  return true;
}

/** Сдвиг строки влево с объединением одинаковых соседей. */
function collapseRow(row) {
  const tiles = row.filter(Boolean);
  const out = [];
  for (let i = 0; i < tiles.length; i++) {
    if (tiles[i] === tiles[i + 1]) {
      out.push(tiles[i] * 2);
      score += tiles[i] * 2;
      i++;
    } else out.push(tiles[i]);
  }
  while (out.length < SIZE) out.push(0);
  return out;
}

/** @param {'left'|'right'|'up'|'down'} dir */
function move(dir) {
  if (over) return;

  const next = emptyBoard();
  for (let i = 0; i < SIZE; i++) {
    // Собираем строку/столбец в нужном направлении
    let line = [];
    for (let j = 0; j < SIZE; j++) {
      if (dir === 'left') line.push(board[i][j]);
      else if (dir === 'right') line.push(board[i][SIZE - 1 - j]);
      else if (dir === 'up') line.push(board[j][i]);
      else line.push(board[SIZE - 1 - j][i]);
    }
    line = collapseRow(line);
    for (let j = 0; j < SIZE; j++) {
      if (dir === 'left') next[i][j] = line[j];
      else if (dir === 'right') next[i][j] = line[SIZE - 1 - j];
      else if (dir === 'up') next[j][i] = line[j];
      else next[SIZE - 1 - j][i] = line[j];
    }
  }

  // Ход засчитан, только если поле изменилось
  const changed = next.some((row, r) => row.some((v, c) => v !== board[r][c]));
  if (!changed) return;

  board = next;
  addTile();
  beep(300 + Math.min(score, 4000) / 20, 45, 'triangle');

  if (!won && board.flat().includes(GOAL)) {
    won = true;
    setTimeout(showWin, 250);
  }
  if (isDead()) {
    over = true;
    setTimeout(() => showDialog(false), 350);
  }
  paint();
  persist();
}

/** Нет ни одного свободного хода (нет пустых клеток и нет пар). */
function isDead() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (!board[r][c]) return false;
      if (c + 1 < SIZE && board[r][c] === board[r][c + 1]) return false;
      if (r + 1 < SIZE && board[r][c] === board[r + 1][c]) return false;
    }
  return true;
}

/* ---------- Сохранение ---------- */
function persist() {
  saveState.save(ID, { board, score, won, keepPlaying, over });
}

function restore() {
  const s = saveState.load(ID);
  if (s?.board?.length === SIZE) {
    ({ board, won, keepPlaying, over } = s);
    score = s.score || 0;
    return true;
  }
  return false;
}

function newGame() {
  board = emptyBoard();
  score = 0; over = false; won = false; keepPlaying = false;
  addTile(); addTile();
  saveState.clear(ID);
  paint();
}

/* ---------- UI ---------- */
let gridEl, scoreEl, bestEl, overlayEl;

function paint() {
  best = Math.max(best, score);
  bestEl.textContent = best;
  scoreEl.textContent = score;

  gridEl.replaceChildren(
    ...board.flatMap((row, r) =>
      row.map((v, c) => {
        const cell = el('div', { class: 'cell', 'data-v': v || '' , text: v || '' });
        if (v) cell.classList.add('filled');
        if (v === GOAL) cell.classList.add('won');
        return cell;
      }),
    ),
  );
}

function showDialog(win) {
  const isRecord = scores.submit(ID, score);
  if (isRecord) best = Math.max(best, score);

  overlayEl.hidden = false;
  overlayEl.replaceChildren(el('div', { class: 'dialog' },
    el('h2', { text: win ? 'Победа!' : 'Ходов нет' }),
    el('p', { text: `Счёт: ${score}${isRecord ? ' — новый рекорд!' : ''}` }),
    el('div', { class: 'row' },
      el('button', {
        class: 'btn primary', text: win && !keepPlaying ? 'Продолжить' : 'Новая игра',
        onclick: () => {
          overlayEl.hidden = true;
          if (win && !keepPlaying) { keepPlaying = true; persist(); return; }
          newGame();
        },
      }),
      el('button', {
        class: 'btn ghost', text: 'На главную',
        onclick: () => navigate('home'),
      }),
    ),
  ));
}

function showWin() {
  if (keepPlaying) return;
  showDialog(true);
}
function render() {
  best = scores.best(ID);
  if (!restore()) { board = emptyBoard(); addTile(); addTile(); }

  scoreEl = el('b', { text: score });
  bestEl = el('b', { text: best });
  gridEl = el('div', { class: 'g2048', role: 'grid' });
  overlayEl = el('div', { class: 'overlay', hidden: true });

  const node = el('div', {},
    el('div', { class: 'game-head' },
      el('div', { class: 'game-title' }, iconEl('grid', 22), '2048'),
      el('div', { class: 'spacer' }),
      el('div', { class: 'stats' },
        el('div', { class: 'stat' }, el('span', { text: 'Счёт' }), scoreEl),
        el('div', { class: 'stat' }, el('span', { text: 'Рекорд' }), bestEl),
      ),
    ),
    el('div', { class: 'toolbar' },
      el('button', { class: 'btn primary', onclick: newGame },
        iconEl('rotate', 16), ' Новая игра'),
      el('button', { class: 'btn ghost', onclick: () => navigate('home') },
        iconEl('home', 16), ' В меню'),
    ),
    el('div', { class: 'board-wrap' }, gridEl),
    el('p', { class: 'foot', text: 'Стрелки или WASD. На телефоне — свайпы по полю.' }),
    overlayEl,
  );

  paint();

  // --- Ввод ---
  const KEYMAP = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
  };
  const offKey = onKey((e) => {
    const dir = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase?.()];
    if (dir) { e.preventDefault(); move(dir); }
  });

  onSwipe(gridEl, (dx, dy) => {
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  return {
    node,
    dispose() { offKey(); persist(); },
  };
}

  return { render };
})();

/* js/games/snake.js */
const m_js_games_snake = (function () {
const el = m_js_utils.el;
const onSwipe = m_js_utils.onSwipe;
const onKey = m_js_utils.onKey;
const beep = m_js_utils.beep;
const iconEl = m_js_icons.iconEl;
const scores = m_js_storage.scores;
const navigate = m_js_nav.navigate;

/**
 * Змейка — поле 20x20, еда, счёт, ускорение при росте, свайпы и D-pad.
 */





const N = 20;
const ID = 'snake';
const BASE_STEP = 150;  // мс на шаг в начале, мс
const MIN_STEP = 60;    // максимальная скорость

let snake, dir, nextDir, food, score, best, dead, timer, gridEl, scoreEl, bestEl, overlayEl, paused;

/** Стартовая скорость растёт вместе со счётом. */
const stepFor = (sc) => Math.max(MIN_STEP, BASE_STEP - sc * 2);

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = nextDir = { x: 1, y: 0 };
  score = 0; dead = false; paused = false;
  placeFood();
}

function placeFood() {
  let f;
  do {
    f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
  } while (snake.some((s) => s.x === f.x && s.y === f.y));
  food = f;
}

/** Разворот на 180° запрещён — иначе змейка «съедает» себя в один ход. */
function setDir(d) {
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
}

function tick() {
  if (dead || paused) return;
  dir = nextDir;

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Стена = смерть
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) return die();
  // Хвост = смерть (клетка хвоста освободится — её не считаем)
  if (snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) return die();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    beep(660, 50, 'square');
    placeFood();
  } else {
    snake.pop();
  }

  paint();
  clearTimeout(timer);
  timer = setTimeout(tick, stepFor(score));
}

function die() {
  dead = true;
  beep(160, 220, 'sawtooth');
  const isRecord = scores.submit(ID, score);
  if (isRecord) best = score;
  paint();
  overlayEl.hidden = false;
  overlayEl.replaceChildren(el('div', { class: 'dialog' },
    el('h2', { text: 'Игра окончена' }),
    el('p', { text: `Счёт: ${score}${isRecord ? ' — новый рекорд!' : ''}` }),
    el('div', { class: 'row' },
      el('button', { class: 'btn primary', text: 'Заново', onclick: start }),
      el('button', { class: 'btn ghost', onclick: () => navigate('home') }, 'В меню'),
    ),
  ));
}

function start() {
  reset();
  overlayEl.hidden = true;
  paint();
  clearTimeout(timer);
  timer = setTimeout(tick, BASE_STEP);
}

function togglePause() {
  if (dead) return;
  paused = !paused;
  if (!paused) timer = setTimeout(tick, stepFor(score));
}

function paint() {
  best = Math.max(best, score);
  scoreEl.textContent = score;
  bestEl.textContent = best;

  const cells = [];
  for (let y = 0; y < N; y++)
    for (let x = 0; x < N; x++) {
      let cls = 'snake-cell';
      if (x === food.x && y === food.y) cls += ' food';
      else if (x === snake[0].x && y === snake[0].y) cls += ' head';
      else if (snake.some((s) => s.x === x && s.y === y)) cls += ' body';
      cells.push(el('div', { class: cls }));
    }
  gridEl.replaceChildren(...cells);
}
function render() {
  best = scores.best(ID);
  reset();

  scoreEl = el('b', { text: 0 });
  bestEl = el('b', { text: best });
  gridEl = el('div', { class: 'snake-grid' });
  overlayEl = el('div', { class: 'overlay', hidden: true });

  const DIRS = { u: { x: 0, y: -1 }, d: { x: 0, y: 1 }, l: { x: -1, y: 0 }, r: { x: 1, y: 0 } };
  const dpad = el('div', { class: 'dpad' },
    el('button', { class: 'btn u', 'aria-label': 'Вверх', text: '▲', onclick: () => setDir(DIRS.u) }),
    el('button', { class: 'btn l', 'aria-label': 'Влево', text: '◀', onclick: () => setDir(DIRS.l) }),
    el('button', { class: 'btn r', 'aria-label': 'Вправо', text: '▶', onclick: () => setDir(DIRS.r) }),
    el('button', { class: 'btn dn', 'aria-label': 'Вниз', text: '▼', onclick: () => setDir(DIRS.d) }),
  );

  const node = el('div', {},
    el('div', { class: 'game-head' },
      el('div', { class: 'game-title' }, iconEl('grid', 22), 'Змейка'),
      el('div', { class: 'spacer' }),
      el('div', { class: 'stats' },
        el('div', { class: 'stat' }, el('span', { text: 'Счёт' }), scoreEl),
        el('div', { class: 'stat' }, el('span', { text: 'Рекорд' }), bestEl),
      ),
    ),
    el('div', { class: 'toolbar' },
      el('button', { class: 'btn primary', onclick: start }, iconEl('rotate', 16), ' Заново'),
      el('button', { class: 'btn', onclick: togglePause, text: 'Пауза' }),
      el('button', { class: 'btn ghost', onclick: () => navigate('home') }, iconEl('home', 16), ' В меню'),
    ),
    el('div', { class: 'snake-wrap' }, gridEl, dpad),
    el('p', { class: 'foot', text: 'Стрелки / WASD или свайпы. Чем длиннее змейка — тем быстрее.' }),
    overlayEl,
  );

  paint();
  start();

  const KEYMAP = {
    ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r',
    w: 'u', s: 'd', a: 'l', d: 'r',
  };
  const offKey = onKey((e) => {
    const k = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase?.()];
    if (k) { e.preventDefault(); setDir(DIRS[k]); }
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePause(); }
  });

  onSwipe(gridEl, (dx, dy) => {
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIRS.r : DIRS.l) : (dy > 0 ? DIRS.d : DIRS.u));
  });

  return {
    node,
    dispose() { clearTimeout(timer); offKey(); },
  };
}

  return { render };
})();

/* js/games/minesweeper.js */
const m_js_games_minesweeper = (function () {
const el = m_js_utils.el;
const beep = m_js_utils.beep;
const iconEl = m_js_icons.iconEl;
const saveState = m_js_storage.saveState;
const navigate = m_js_nav.navigate;

/**
 * Сапер — три сложности, безопасный первый клик, таймер, флажки
 * (ПКМ на десктопе, долгий тап на тач-устройствах).
 *
 * Модель клетки — объект, чтобы не путать число рядом с признаком
 * «открыто»: { mine, near, open, flag, reveal }
 */





const ID = 'mines';
const LEVELS = {
  easy: { cols: 9, rows: 9, mines: 10, label: 'Легкий' },
  mid: { cols: 16, rows: 16, mines: 40, label: 'Средний' },
  hard: { cols: 24, rows: 16, mines: 70, label: 'Сложный' },
};

let level = 'easy';
let cells;           // клетки [r][c]
let started;         // мины расставлены?
let dead, finished;  // результат партии
let elapsed = 0, timer = null;
let gridEl, minesEl, timeEl, bestEl, overlayEl;
let bestTime = null;

/* ---------- Генерация поля ---------- */

const inside = (r, c, rows, cols) => r >= 0 && c >= 0 && r < rows && c < cols;

function build() {
  const L = LEVELS[level];
  cells = Array.from({ length: L.rows }, () =>
    Array.from({ length: L.cols }, () => ({ mine: false, near: 0, open: false, flag: false })),
  );
  started = false; dead = false; finished = false;
  elapsed = 0;
  stopTimer();
}

/**
 * Ставит мины так, чтобы первая открытая клетка и её 8 соседей остались чистыми.
 * Кандидаты — всё поле минус защищённая зона (крест и вокруг креста).
 */
function placeMines(safeR, safeC) {
  const L = LEVELS[level];

  // Защищённая зона: крест вокруг первого клика + пояс вокруг креста
  const protectedZone = new Set();
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      for (let ar = -1; ar <= 1; ar++)
        for (let ac = -1; ac <= 1; ac++) {
          const r = safeR + dr + ar, c = safeC + dc + ac;
          if (inside(r, c, L.rows, L.cols)) protectedZone.add(`${r},${c}`);
        }
    }

  const pool = [];
  for (let r = 0; r < L.rows; r++)
    for (let c = 0; c < L.cols; c++)
      if (!protectedZone.has(`${r},${c}`)) pool.push([r, c]);

  const take = Math.min(L.mines, pool.length);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  for (let i = 0; i < take; i++) cells[pool[i][0]][pool[i][1]].mine = true;

  for (let r = 0; r < L.rows; r++)
    for (let c = 0; c < L.cols; c++) {
      if (cells[r][c].mine) continue;
      cells[r][c].near = countAround(r, c, L);
    }
}

function countAround(r, c, L) {
  let n = 0;
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      if (inside(r + dr, c + dc, L.rows, L.cols) && cells[r + dr][c + dc].mine) n++;
    }
  return n;
}

/* ---------- Таймер ---------- */
function startTimer() {
  stopTimer();
  timer = setInterval(() => {
    if (dead || finished || elapsed >= 999) return;
    elapsed++;
    timeEl.textContent = elapsed;
  }, 1000);
}
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

/* ---------- Действия ---------- */

function open(r, c) {
  const L = LEVELS[level];
  if (dead || finished) return;
  const cell = cells[r][c];
  if (cell.open || cell.flag) return;

  // Первый клик — расставляем мины, гарантируя безопасность этой клетки
  if (!started) {
    placeMines(r, c);
    started = true;
    startTimer();
    saveState.save(ID, { level });
  }

  if (cell.mine) { lose(r, c); return; }

  // Раскрываем островок нулей итеративно (без риска переполнения стека)
  const stack = [[r, c]];
  while (stack.length) {
    const [rr, cc] = stack.pop();
    const cur = cells[rr][cc];
    if (cur.open || cur.flag || cur.mine) continue;
    cur.open = true;
    paintCell(rr, cc);
    if (cur.near === 0) {
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          if (dr || dc) {
            const nr = rr + dr, nc = cc + dc;
            if (inside(nr, nc, L.rows, L.cols)) stack.push([nr, nc]);
          }
        }
    }
  }

  if (countClosed() === 0) win();
  updateCounters();
}

function toggleFlag(r, c) {
  if (dead || finished) return;
  const cell = cells[r][c];
  if (cell.open) return;
  cell.flag = !cell.flag;
  beep(cell.flag ? 520 : 380, 40);
  paintCell(r, c);
  updateCounters();
}

/** Сколько не-мин ещё закрыто. */
function countClosed() {
  let n = 0;
  for (const row of cells) for (const cell of row) if (!cell.open && !cell.mine) n++;
  return n;
}

function lose(br, bc) {
  dead = true;
  stopTimer();
  beep(110, 320, 'sawtooth');
  for (let r = 0; r < cells.length; r++)
    for (let c = 0; c < cells[0].length; c++) {
      const cell = cells[r][c];
      if (cell.mine) cell.reveal = r === br && c === bc ? 'boom' : 'mine';
      else if (cell.flag) cell.reveal = 'wrong';
    }
  paint();
  showDialog('Проиграли', `Время: ${elapsed} с`);
}

function win() {
  finished = true;
  stopTimer();
  const isRecord = bestTime === null || elapsed < bestTime;
  if (isRecord) {
    bestTime = elapsed;
    bestEl.textContent = elapsed;
    saveState.save(ID + ':time', { bestTime });
  }
  beep(880, 140, 'triangle');
  paint();
  showDialog('Победа!', `Время: ${elapsed} с${isRecord ? ' — рекорд!' : ''}`);
}

const flagCount = () => cells.flat().filter((c) => c.flag).length;

function updateCounters() {
  minesEl.textContent = LEVELS[level].mines - flagCount();
  timeEl.textContent = elapsed;
}

function showDialog(title, text) {
  overlayEl.hidden = false;
  overlayEl.replaceChildren(el('div', { class: 'dialog' },
    el('h2', { text: title }),
    el('p', { text }),
    el('div', { class: 'row' },
      el('button', { class: 'btn primary', text: 'Заново', onclick: () => { overlayEl.hidden = true; newGame(level); } }),
      el('button', { class: 'btn ghost', onclick: () => navigate('home') }, 'В меню'),
    ),
  ));
}

/* ---------- Отрисовка ---------- */

function cellClass(cell) {
  const base = 'mc';
  if (cell.reveal === 'boom' || cell.reveal === 'mine') return base + ' mine';
  if (cell.reveal === 'wrong') return base + ' open';
  if (cell.flag) return base + ' flag';
  if (cell.open) return base + ' open' + (cell.near ? ' n' + cell.near : '');
  return base;
}

function cellText(cell) {
  if (cell.reveal === 'boom') return '💥';
  if (cell.reveal === 'mine') return '💣';
  if (cell.reveal === 'wrong') return '✖';
  if (cell.flag) return '🚩';
  if (cell.open && cell.near) return String(cell.near);
  return '';
}

function paintCell(r, c) {
  const node = gridEl.children[r * cells[0].length + c];
  if (!node) return;
  const cell = cells[r][c];
  node.className = cellClass(cell);
  node.textContent = cellText(cell);
}

function paint() {
  const L = LEVELS[level];
  gridEl.style.gridTemplateColumns = `repeat(${L.cols}, auto)`;
  gridEl.replaceChildren();
  for (let r = 0; r < L.rows; r++)
    for (let c = 0; c < L.cols; c++) {
      const cell = cells[r][c];
      const btn = el('button', {
        class: cellClass(cell),
        'aria-label': `Клетка ${r + 1}:${c + 1}`,
        text: cellText(cell),
      });
      wireCell(btn, r, c);
      gridEl.append(btn);
    }
  updateCounters();
}

function wireCell(btn, r, c) {
  btn.addEventListener('click', (e) => { e.preventDefault(); open(r, c); });
  btn.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleFlag(r, c); });

  // Долгий тап на мобильных = флажок
  let hold = null;
  btn.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    hold = setTimeout(() => { hold = null; toggleFlag(r, c); }, 420);
  });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
    btn.addEventListener(ev, () => { if (hold) { clearTimeout(hold); hold = null; } });
  }
}

/* ---------- Жизненный цикл ---------- */

function newGame(lv) {
  level = lv || level;
  build();
  overlayEl.hidden = true;
  saveState.clear(ID);
  paint();
}
function render() {
  level = saveState.load(ID)?.level || 'easy';
  bestTime = saveState.load(ID + ':time')?.bestTime ?? null;

  minesEl = el('b', { text: LEVELS[level].mines });
  timeEl = el('b', { text: 0 });
  bestEl = el('b', { text: bestTime ?? '—' });
  gridEl = el('div', { class: 'mine-grid' });
  overlayEl = el('div', { class: 'overlay', hidden: true });

  const seg = el('div', { class: 'seg' });
  for (const [key, cfg] of Object.entries(LEVELS)) {
    seg.append(el('button', {
      'aria-pressed': String(key === level),
      text: cfg.label,
      onclick: (e) => {
        [...seg.children].forEach((b) => b.setAttribute('aria-pressed', 'false'));
        e.currentTarget.setAttribute('aria-pressed', 'true');
        newGame(key);
      },
    }));
  }

  const node = el('div', {},
    el('div', { class: 'game-head' },
      el('div', { class: 'game-title' }, iconEl('grid', 22), 'Сапер'),
      el('div', { class: 'spacer' }),
      el('div', { class: 'stats' },
        el('div', { class: 'stat' }, el('span', { text: 'Мины' }), minesEl),
        el('div', { class: 'stat' }, el('span', { text: 'Время' }), timeEl),
        el('div', { class: 'stat' }, el('span', { text: 'Рекорд' }), bestEl),
      ),
    ),
    el('div', { class: 'toolbar' },
      seg,
      el('button', { class: 'btn primary', onclick: () => newGame(level) }, iconEl('rotate', 16), ' Заново'),
      el('button', { class: 'btn ghost', onclick: () => navigate('home') }, iconEl('home', 16), ' В меню'),
    ),
    el('div', { class: 'mine-wrap' }, gridEl),
    el('p', { class: 'foot', text: 'ПКМ или долгий тап — флажок. Первый клик всегда безопасный.' }),
    overlayEl,
  );

  newGame(level);
  return { node, dispose() { stopTimer(); } };
}

  return { LEVELS, render };
})();

/* js/games/tetris.js */
const m_js_games_tetris = (function () {
const el = m_js_utils.el;
const onKey = m_js_utils.onKey;
const onSwipe = m_js_utils.onSwipe;
const beep = m_js_utils.beep;
const iconEl = m_js_icons.iconEl;
const scores = m_js_storage.scores;
const navigate = m_js_nav.navigate;

/**
 * Тетрис — canvas-рендер, стакан 10x20, 7 фигур, превью следующей,
 * сброс, поворот, soft/hard drop, пауза.
 */





const COLS = 10, ROWS = 20, CELL = 24;
const ID = 'tetris';

/** Фигуры заданы в координатах своей матрицы + цвет. */
const SHAPES = {
  I: { color: '#37c8d0', cells: [[0, 1], [1, 1], [2, 1], [3, 1]] },
  J: { color: '#4d8bff', cells: [[0, 0], [0, 1], [1, 1], [2, 1]] },
  L: { color: '#ff9f43', cells: [[2, 0], [0, 1], [1, 1], [2, 1]] },
  O: { color: '#ffe14d', cells: [[1, 0], [2, 0], [1, 1], [2, 1]] },
  S: { color: '#37d39b', cells: [[1, 0], [2, 0], [0, 1], [1, 1]] },
  T: { color: '#a86cff', cells: [[1, 0], [0, 1], [1, 1], [2, 1]] },
  Z: { color: '#ff5c72', cells: [[0, 0], [1, 0], [1, 1], [2, 1]] },
};
const NAMES = Object.keys(SHAPES);

let board;            // [ROWS][COLS] — null или {color}
let cur, next;        // активная и следующая фигура
let score, lines, level, best;
let dropTimer, paused, dead, raf;
let canvas, ctx, scoreEl, linesEl, levelEl, bestEl, previewEl, overlayEl;

const bag = [];

function nextFromBag() {
  if (!bag.length) {
    // «Мешок» — честная случайность без повторов подряд
    bag.push(...NAMES);
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }
  const name = bag.pop();
  return { name, cells: SHAPES[name].cells.map(([r, c]) => [r, c]) };
}

const colorOf = (name) => SHAPES[name].color;

function spawn() {
  cur = next || nextFromBag();
  next = nextFromBag();
  cur.x = Math.floor((COLS - 3) / 2);
  cur.y = -1;
  if (collides(cur.cells, cur.x, cur.y)) { die(); return; }
  drawPreview();
}

/** Столкновение с полем/дном. */
function collides(cells, ox, oy) {
  for (const [r, c] of cells) {
    const x = ox + c, y = oy + r;
    if (x < 0 || x >= COLS || y >= ROWS) return true;
    if (y >= 0 && board[y][x]) return true;
  }
  return false;
}

function lock() {
  for (const [r, c] of cur.cells) {
    const x = cur.x + c, y = cur.y + r;
    if (y < 0) { die(); return; }
    board[y][x] = { color: colorOf(cur.name) };
  }
  const cleared = clearLines();
  if (cleared > 0) {
    lines += cleared;
    score += [0, 100, 300, 500, 800][cleared] * level;
    level = 1 + Math.floor(lines / 10);
    dropInterval = Math.max(90, 700 - (level - 1) * 65);
    beep(760, 60, 'triangle');
  }
  if (score > best) best = score;
  spawn();
  updateStats();
  draw();
}

/** Удаляет полные строки, возвращает их количество. */
function clearLines() {
  let n = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(Boolean)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(null));
      n++;
      r++;
    }
  }
  return n;
}

function die() {
  dead = true;
  paused = false;
  cancelAnimationFrame(raf);
  const isRecord = scores.submit(ID, score);
  if (isRecord) best = score;
  updateStats();
  showDialog('Игра окончена', `Счёт: ${score}${isRecord ? ' — новый рекорд!' : ''}`);
}

let dropInterval = 700;

function move(dx) {
  if (dead || paused) return;
  if (!collides(cur.cells, cur.x + dx, cur.y)) { cur.x += dx; draw(); }
}
function softDrop() {
  if (dead || paused) return;
  if (!collides(cur.cells, cur.x, cur.y + 1)) { cur.y++; score += 1; updateStats(); draw(); }
  else lock();
}
function hardDrop() {
  if (dead || paused) return;
  let d = 0;
  while (!collides(cur.cells, cur.x, cur.y + 1)) { cur.y++; d++; }
  score += d * 2;
  beep(240, 40, 'square');
  lock();
}

/** Поворот на 90° вокруг центра матрицы 3x3. */
function rotate() {
  if (dead || paused || cur.name === 'O') return;
  const size = 3;
  const rotated = cur.cells.map(([r, c]) => [size - 1 - c, r]);
  if (!collides(rotated, cur.x, cur.y)) { cur.cells = rotated; draw(); return; }
  // Пробуем «кик» стены/пола
  for (const shift of [-1, 1, -2, 2]) {
    if (!collides(rotated, cur.x + shift, cur.y)) {
      cur.cells = rotated; cur.x += shift; draw(); return;
    }
  }
}

function togglePause() {
  if (dead) return;
  paused = !paused;
  showPause(paused);
}

function showPause(state) {
  if (state) {
    overlayEl.hidden = false;
    overlayEl.replaceChildren(el('div', { class: 'dialog' },
      el('h2', { text: 'Пауза' }),
      el('p', { text: 'Нажми пробел или кнопку, чтобы продолжить.' }),
      el('div', { class: 'row' },
        el('button', { class: 'btn primary', text: 'Продолжить', onclick: togglePause }),
        el('button', { class: 'btn ghost', onclick: () => navigate('home') }, 'В меню'),
      ),
    ));
  } else overlayEl.hidden = true;
}

/* ---------- Рендер ---------- */

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = COLS * CELL, h = ROWS * CELL;
  if (canvas.width !== w * dpr) {
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // сетка
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border');
  ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, h); ctx.stroke(); }
  for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(w, y * CELL); ctx.stroke(); }

  // уложенные блоки
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c]) block(c, r, board[r][c].color);

  // активная фигура
  if (cur && !dead) for (const [r, c] of cur.cells) {
    if (cur.y + r >= 0) block(cur.x + c, cur.y + r, colorOf(cur.name));
  }
}

function block(cx, cy, color) {
  ctx.fillStyle = color;
  ctx.fillRect(cx * CELL + 1, cy * CELL + 1, CELL - 2, CELL - 2);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(cx * CELL + 1, cy * CELL + 1, CELL - 2, 4);
}

function drawPreview() {
  if (!next) return;
  const color = colorOf(next.name);
  previewEl.replaceChildren(
    ...next.cells.map(([r, c]) => {
      const d = el('div');
      d.style.cssText = `width:18px;height:18px;background:${color};border-radius:4px;margin:2px;position:absolute;left:${(c - 1) * 18}px;top:${r * 18}px`;
      return d;
    }),
  );
}

function updateStats() {
  scoreEl.textContent = score;
  linesEl.textContent = lines;
  levelEl.textContent = level;
  bestEl.textContent = best;
}

function showDialog(title, text) {
  overlayEl.hidden = false;
  overlayEl.replaceChildren(el('div', { class: 'dialog' },
    el('h2', { text: title }),
    el('p', { text }),
    el('div', { class: 'row' },
      el('button', { class: 'btn primary', text: 'Заново', onclick: () => { overlayEl.hidden = true; start(); } }),
      el('button', { class: 'btn ghost', onclick: () => navigate('home') }, 'В меню'),
    ),
  ));
}

function start() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  bag.length = 0;
  score = 0; lines = 0; level = 1; dead = false; paused = false;
  dropInterval = 700;
  next = nextFromBag();
  spawn();
  updateStats();
  draw();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

/** Игровой цикл: фиксированный шаг падения + перерисовка по событию. */
function loop(ts) {
  if (dead) return;
  if (!paused && ts - (loop.last || 0) > dropInterval) {
    loop.last = ts;
    if (!collides(cur.cells, cur.x, cur.y + 1)) { cur.y++; score += 1; updateStats(); draw(); }
    else lock();
  }
  raf = requestAnimationFrame(loop);
}

/* ---------- Точка входа ---------- */
function render() {
  best = scores.best(ID);
  canvas = el('canvas', { class: 'tet-canvas' });
  ctx = canvas.getContext('2d');
  scoreEl = el('b', { text: 0 });
  linesEl = el('b', { text: 0 });
  levelEl = el('b', { text: 1 });
  bestEl = el('b', { text: best });
  previewEl = el('div', { style: 'position:relative;width:56px;height:56px' });
  overlayEl = el('div', { class: 'overlay', hidden: true });

  const box = (label, node) => el('div', { class: 'tet-box' }, el('span', { text: label }), node);

  const node = el('div', {},
    el('div', { class: 'game-head' },
      el('div', { class: 'game-title' }, iconEl('grid', 22), 'Тетрис'),
      el('div', { class: 'spacer' }),
      el('div', { class: 'stats' },
        box('Счёт', scoreEl), box('Линии', linesEl), box('Уровень', levelEl), box('Рекорд', bestEl),
      ),
    ),
    el('div', { class: 'toolbar' },
      el('button', { class: 'btn primary', onclick: start }, iconEl('rotate', 16), ' Новая игра'),
      el('button', { class: 'btn', text: 'Пауза', onclick: togglePause }),
      el('button', { class: 'btn ghost', onclick: () => navigate('home') }, iconEl('home', 16), ' В меню'),
    ),
    el('div', { class: 'tet-wrap' },
      el('div', { class: 'tet-cols' },
        el('div', { class: 'tet-side' }, el('div', { class: 'tet-box' }, el('span', { text: 'Дальше' }), previewEl)),
        canvas,
      ),
    ),
    el('p', { class: 'foot', text: '← → движение · ↓ ускорить · ↑/X поворот · пробел сбросить · Esc пауза. На телефоне — свайпы и кнопки.' }),
    overlayEl,
  );

  // Мобильные кнопки управления
  const ctl = el('div', { class: 'dpad', style: 'grid-template-columns:repeat(5,52px);grid-template-rows:repeat(2,52px)' },
    el('button', { class: 'btn', style: 'grid-area:1/1', text: '←', onclick: () => move(-1) }),
    el('button', { class: 'btn', style: 'grid-area:1/2', text: '↻', onclick: rotate }),
    el('button', { class: 'btn', style: 'grid-area:1/3', text: '→', onclick: () => move(1) }),
    el('button', { class: 'btn', style: 'grid-area:2/1', text: '↓', onclick: softDrop }),
    el('button', { class: 'btn', style: 'grid-area:2/2', text: '⤓', onclick: hardDrop }),
    el('button', { class: 'btn', style: 'grid-area:2/3', text: '⏸', onclick: togglePause }),
  );
  node.querySelector('.tet-wrap').append(ctl);

  start();

  const KEY = {
    ArrowLeft: () => move(-1), a: () => move(-1),
    ArrowRight: () => move(1), d: () => move(1),
    ArrowDown: () => softDrop(), s: () => softDrop(),
    ArrowUp: () => rotate(), x: () => rotate(), w: () => rotate(),
    ' ': () => hardDrop(), Escape: () => togglePause(),
  };
  const offKey = onKey((e) => {
    const fn = KEY[e.key] || KEY[e.key.toLowerCase?.()];
    if (fn) { e.preventDefault(); fn(); }
  });

  // Свайпы: влево/вправо — сдвиг, вниз — soft, быстрый свайп вниз — hard drop
  let lastSwipe = 0;
  onSwipe(canvas, (dx, dy) => {
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1);
    else if (dy > 0) {
      if (Date.now() - lastSwipe < 120) hardDrop();
      else softDrop();
    } else rotate();
    lastSwipe = Date.now();
  }, 24);

  return { node, dispose() { cancelAnimationFrame(raf); offKey(); } };
}

  return { render };
})();
})();
</script>
</body>
</html>
